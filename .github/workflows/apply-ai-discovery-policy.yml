name: Apply AI discovery policy
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-ai-discovery-policy.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch discovery policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/product_intelligence/batch.py')
          s=p.read_text(encoding='utf-8')
          old='needs_ai=bool(ai_config and ai_config.discovery_enabled and (not has_official or not has_preferred_official))'
          new='needs_ai=bool(ai_config and ai_config.discovery_enabled)'
          assert old in s, 'target policy line not found'
          s=s.replace(old,new,1)
          s=s.replace('IA web discovery: {len(ai_urls)} URLs candidatas para mejorar fuente oficial/regional; todas se validarán con el scraper','IA web discovery técnica: {len(ai_urls)} URLs oficiales/técnicas candidatas; se prueban primero y todas se validan con el scraper',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name artosperu-bot
          git config user.email artosperu@gmail.com
          git add src/product_intelligence/batch.py
          git commit -m "feat: run optional AI technical discovery before scraping" || exit 0
          git push
