name: Apply AI regional refinement

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/refine_ai_regional_discovery.py'
      - '.github/workflows/apply-ai-regional-refinement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply regional discovery refinement
        run: python tools/refine_ai_regional_discovery.py
      - name: Install test profile
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run regression suite
        run: pytest -q
      - name: Commit source refinement
        run: |
          git config user.name 'artosperu-bot'
          git config user.email 'artosperu@gmail.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No generated source changes'
          else
            git commit -m 'feat: prefer AI-assisted official discovery when regional source is missing'
            git push
          fi
