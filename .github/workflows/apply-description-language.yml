name: Apply description language
on:
  push:
    paths:
      - 'tools/fix_description_language.py'
      - '.github/workflows/apply-description-language.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/fix_description_language.py
      - run: pip install -e '.[dev]' && pytest -q
      - run: |
          git config user.name artosperu-bot
          git config user.email artosperu@gmail.com
          git add src
          git commit -m 'fix: keep generated marketplace descriptions consistently Spanish' || exit 0
          git push
