name: Apply final product intelligence hardening
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/apply-final-product-intelligence.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final source changes
        run: |
          python tools/finalize_bluetooth_translation.py
          python tools/finalize_multisource_consistency.py
      - name: Run full suite
        run: |
          python -m pip install -e . pytest
          pytest -q
      - name: Commit only if green
        run: |
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add src/product_intelligence/field_derivations.py src/product_intelligence/batch.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: explicit Bluetooth, Spanish descriptions and source consistency"
          git push origin main
