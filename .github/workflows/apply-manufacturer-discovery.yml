name: Apply manufacturer discovery
on:
  push:
    paths:
      - 'tools/improve_manufacturer_discovery.py'
      - '.github/workflows/apply-manufacturer-discovery.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/improve_manufacturer_discovery.py
      - run: pip install -e '.[dev]' && pytest -q
      - run: |
          git config user.name artosperu-bot
          git config user.email artosperu@gmail.com
          git add src
          git commit -m 'feat: rediscover manufacturer after learning brand from exact MPN' || exit 0
          git push
