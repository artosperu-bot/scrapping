name: Apply multi-input AI discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_multi_input_ai_discovery.py'
      - '.github/workflows/apply-multi-input-ai-discovery.yml'

permissions:
  contents: write

concurrency:
  group: apply-multi-input-ai-discovery
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_multi_input_ai_discovery.py
      - name: Install test profile
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run regression suite
        run: pytest -q
      - name: Commit generated changes
        run: |
          git config user.name 'artosperu-bot'
          git config user.email 'artosperu@gmail.com'
          git add src tests
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'feat: support generic product identities and AI web discovery fallback'
            git push
          fi
# rerun after stale mapper import cleanup
