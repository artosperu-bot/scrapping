name: Apply official query stage
on:
  push:
    paths:
      - 'tools/improve_official_query_stage.py'
      - '.github/workflows/apply-official-query-stage.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/improve_official_query_stage.py
      - run: pip install -e '.[dev]' && pytest -q
      - run: |
          git config user.name artosperu-bot
          git config user.email artosperu@gmail.com
          git add src
          git commit -m 'feat: explicitly search manufacturer when exact MPN results are retailer-only' || exit 0
          git fetch origin main
          git rebase origin/main
          git push
