name: Apply remove AI cleanup
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-remove-ai-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete AI path and stale artifacts
        shell: python
        run: |
          from pathlib import Path

          # batch.py
          p=Path('src/product_intelligence/batch.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from .ai_enrichment import AIConfig\n','')
          s=s.replace('from .ai_discovery import discover_official_urls\n','')
          s=s.replace('def scrape_item(item: BatchItem, out_dir: str, template_plan: dict | None = None, ai_config: AIConfig | None = None, log=lambda m: None) -> ProductRecord | None:',
                      'def scrape_item(item: BatchItem, out_dir: str, template_plan: dict | None = None, log=lambda m: None) -> ProductRecord | None:')
          start=s.find('    preferred_country=(getattr(ai_config,')
          end=s.find('    media_slots = ', start)
          if start!=-1 and end!=-1:
              s=s[:start]+s[end:]
          s=s.replace('(getattr(candidate,"ai_assisted",False) or getattr(candidate,"manual_source",False))', 'getattr(candidate,"manual_source",False)')
          s=s.replace('    ai_config: AIConfig | None = None,\n','')
          s=s.replace('rec = scrape_item(item, str(out / "json"), template_plan=template_plan, ai_config=ai_config, log=log)',
                      'rec = scrape_item(item, str(out / "json"), template_plan=template_plan, log=log)')
          s=s.replace('        ai_config=ai_config,\n','')
          p.write_text(s,encoding='utf-8')

          # excel_mapper_v8.py
          p=Path('src/product_intelligence/excel_mapper_v8.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from .ai_enrichment import AIConfig,AIEnricher\n','')
          s=s.replace('def fill_excel_v8(template,output,records,overwrite=False,trace_path=None,ai_config:AIConfig|None=None,row_assignments:dict[tuple[str,int],ProductRecord]|None=None):\n    ai=AIEnricher(ai_config or AIConfig())\n',
                      'def fill_excel_v8(template,output,records,overwrite=False,trace_path=None,row_assignments:dict[tuple[str,int],ProductRecord]|None=None):\n')
          ai_start=s.find('                if ai.config.enabled and (ext==\'53\'')
          derived=s.find('                value,vconf,reason,ev_attr,ev_raw=_derived_for_field', ai_start)
          if ai_start!=-1 and derived!=-1:
              s=s[:ai_start]+s[derived:]
          p.write_text(s,encoding='utf-8')

          # desktop.py
          p=Path('src/product_intelligence/desktop.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from .ai_enrichment import AIConfig\n','')
          s=s.replace('from .model_catalog import DEFAULT_MODELS, capability, list_models\n','')
          prov=s.find('PROVIDER_DEFAULTS={')
          cls=s.find('class App(',prov)
          if prov!=-1 and cls!=-1:
              s=s[:prov]+s[cls:]
          for line in [
              "        self.ai_discovery=tk.BooleanVar(value=False);self.ai_enrichment=tk.BooleanVar(value=False)\n",
              "        self.ai_provider=tk.StringVar(value='off');self.ai_model=tk.StringVar(value='')\n",
              "        self.ai_base=tk.StringVar(value='');self.ai_key=tk.StringVar(value='');self.ai_country=tk.StringVar(value='PE')\n",
          ]:
              s=s.replace(line,'')
          method_start=s.find('    def _provider_changed(')
          manual_start=s.find('    def _manual_entries(',method_start)
          if method_start!=-1 and manual_start!=-1:
              s=s[:method_start]+s[manual_start:]
          s=s.replace(';cfg=None\n','\n')
          s=s.replace(',ai_config=None,manual_identities=', ',manual_identities=')
          s=s.replace(',trace_path=str(trace),ai_config=None)', ',trace_path=str(trace))')
          p.write_text(s,encoding='utf-8')

          # Make regression tests self-contained instead of reading historical demo JSON.
          Path('tests/test_v9_manual_part_numbers.py').write_text('''from pathlib import Path\nfrom product_intelligence.batch import manual_items\nfrom product_intelligence.excel_mapper_v8 import fill_excel_v8\nfrom product_intelligence.models import ProductIdentity, ProductRecord\n\n\ndef _record():\n    return ProductRecord(identity=ProductIdentity(brand="JBL",product_name="JBL Quantum 350 Wireless",model="Quantum 350 Wireless",mpn="JBLQ350WLBLKAM",confidence=.99,match_level="EXACT",identifiers_confirmed=["mpn"]))\n\ndef test_manual_part_numbers_are_assigned_to_consecutive_rows():\n    root=Path(__file__).resolve().parents[1]\n    template=root/'examples'/'ProductCreationTemplate_reference.xlsx'\n    items=manual_items(str(template),['JBLQ350WLBLKAM','JBLENDURRUN3BTBAM','JBLT530CBLKAM'])\n    assert [(x.sheet,x.row,x.identity.mpn) for x in items] == [('Subir plantilla',5,'JBLQ350WLBLKAM'),('Subir plantilla',6,'JBLENDURRUN3BTBAM'),('Subir plantilla',7,'JBLT530CBLKAM')]\n\ndef test_manual_row_assignment_can_fill_empty_template(tmp_path):\n    root=Path(__file__).resolve().parents[1]\n    template=root/'examples'/'ProductCreationTemplate_reference.xlsx'\n    rec=_record();out=tmp_path/'manual.xlsx'\n    report=fill_excel_v8(str(template),str(out),[rec],overwrite=True,row_assignments={('Subir plantilla',5):rec})\n    assert out.exists();assert report['summary']['written_count'] > 0\n''',encoding='utf-8')

          Path('tests/test_v9_three_headphones_template.py').write_text('''from pathlib import Path\nfrom openpyxl import load_workbook\nfrom product_intelligence.excel_mapper_v8 import fill_excel_v8\nfrom product_intelligence.models import ProductIdentity, ProductRecord\n\nPRODUCTS=[("JBLQ350WLBLKAM","JBL Quantum 350 Wireless","Quantum 350 Wireless"),("JBLENDURRUN3BTBAM","JBL Endurance Run 3 Wireless","Endurance Run 3 Wireless"),("JBLT530CBLKAM","JBL Tune 530C USB-C","Tune 530C")]\n\ndef _record(pn,name,model):\n    return ProductRecord(identity=ProductIdentity(brand="JBL",product_name=name,model=model,mpn=pn,confidence=.99,match_level="EXACT",identifiers_confirmed=["mpn"]))\n\ndef test_three_headphones_fill_consecutive_template_rows(tmp_path):\n    root=Path(__file__).resolve().parents[1];template=root/'examples'/'ProductCreationTemplate_reference.xlsx'\n    records=[_record(*x) for x in PRODUCTS];assignments={("Subir plantilla",5+i):r for i,r in enumerate(records)}\n    output=tmp_path/'headphones_completed.xlsx';trace=tmp_path/'trace.json'\n    report=fill_excel_v8(str(template),str(output),records,overwrite=True,trace_path=str(trace),row_assignments=assignments)\n    assert output.exists() and trace.exists();assert report['summary']['written_count']>0\n    ws=load_workbook(output,data_only=False)['Subir plantilla']\n    names=[str(ws[f"A{row}"].value or "") for row in (5,6,7)]\n    assert 'Quantum 350' in names[0];assert 'Endurance Run 3' in names[1];assert 'Tune 530C' in names[2]\n    assert ws['M5'].value != '999.999,99';assert ws['N5'].value != '999.999,99'\n    assert ws['D5'].value != 'Esto es un párrafo';assert ws['AC5'].value != 'Ej. 80 cm x 45 cm x 63 cm // E.g. 80 cm x 45 cm x 63 cm';assert ws['AD5'].value != '10 m/s'\n''',encoding='utf-8')

          # Remove obsolete modules/tests/artifacts.
          for rel in [
              'src/product_intelligence/ai_discovery.py','src/product_intelligence/ai_enrichment.py','src/product_intelligence/model_catalog.py',
              'tests/test_ai_discovery_openai.py','tests/test_multi_input_ai_discovery.py','tests/test_v8_ai_enrichment.py',
              'demo_output/JBLENDURRUN3BTBAM.v7.json','demo_output/JBLQ350WLBLKAM.v7.json','demo_output/JBLT530CBLKAM.v7.json',
              'official_probe/summary.json','examples/plantilla_productos.xlsx','examples/product.example.json',
          ]:
              f=Path(rel)
              if f.exists(): f.unlink()
      - name: Run regression suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Commit cleanup
        run: |
          git config user.name artosperu-bot
          git config user.email artosperu@gmail.com
          git add -A
          git commit -m "refactor: remove obsolete AI path and legacy artifacts" || exit 0
          git push
