name: Apply Smart Resolution Engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'chore: apply smart resolution engine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python .github/scripts/apply_smart_resolution.py
      - name: Commit changes
        run: |
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add src/product_intelligence tests/test_resolution_engine.py
          git commit -m "feat: add semantic resolution and targeted gap research"
          git push
