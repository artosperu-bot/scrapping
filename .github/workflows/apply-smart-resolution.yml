from product_intelligence.models import Evidence, ProductIdentity, ProductRecord
from product_intelligence.resolution_engine import analyze_resolution, NOT_APPLICABLE


def _rec(evidence):
    return ProductRecord(identity=ProductIdentity(mpn="X1",match_level="EXACT",confidence=.99),evidence=evidence)


def test_full_ip_rating_can_project_water_component_to_allowed_option():
    rec=_rec([Evidence(attribute="IP rating",raw_value="IP65",normalized_value="IP65",source_type="official_html",match_level="EXACT",confidence=.98)])
    d=derive_water_resistance(rec,["No","IPX4","IPX5","IPX7"])
    assert d.value=="IPX5"
    assert "water_component" in d.reason


def test_wired_without_battery_marks_autonomy_not_applicable():
    rec=_rec([
        Evidence(attribute="connection type",raw_value="Wired USB-C",normalized_value="Wired USB-C",source_type="official_html",match_level="EXACT",confidence=.95),
        Evidence(attribute="battery",raw_value="No battery",normalized_value="No battery",source_type="official_html",match_level="EXACT",confidence=.95),
    ])
    d=derive_autonomy(rec)
    assert d.value is None
    assert d.reason.startswith("NOT_APPLICABLE")
    audit=analyze_resolution(rec,{"scrape_semantics":["Autonomía"]})
    assert audit["fields"][0]["status"]==NOT_APPLICABLE


def test_resolution_marks_missing_semantics_for_targeted_research():
    rec=_rec([Evidence(attribute="Bluetooth",raw_value="5.3",normalized_value="5.3",source_type="official_html",match_level="EXACT",confidence=.95)])
    audit=analyze_resolution(rec,{"scrape_semantics":["Bluetooth","Package weight"]})
    states={x["semantic"]:x["status"] for x in audit["fields"]}
    assert states["Bluetooth"]=="FOUND_DIRECT"
    assert states["Package weight"]=="INSUFFICIENT_EVIDENCE"
    assert "Package weight" in audit["research_terms"]
''',encoding='utf-8')
