name: Apply smartness v4
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/apply-smartness-v4.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source changes
        run: |
          python tools/apply_template_smartness.py
          python tools/finalize_template_smartness.py
      - name: Run full regression suite
        run: |
          python -m pip install -e . pytest
          pytest -q
      - name: Commit only if tests pass
        run: |
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add src/product_intelligence tests/test_template_description_guidance.py tests/test_v8_ai_enrichment.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: description-guided fields, Spanish copy and multi-source media"
          git push origin main
