name: Apply targeted Excel and media upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_excel_targeted_media_upgrade.py'
      - '.github/workflows/apply-targeted-media-upgrade.yml'

permissions:
  contents: write

concurrency:
  group: apply-targeted-media-upgrade
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sanitize maintenance regex block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_excel_targeted_media_upgrade.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]; skip=0
          for line in lines:
              if "for m in re.finditer(r'''" in line:
                  skip=3
                  continue
              if skip:
                  skip-=1
                  continue
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Apply upgrade
        run: python tools/apply_excel_targeted_media_upgrade.py
      - name: Install test profile
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run regression suite
        run: pytest -q
      - name: Commit generated source changes
        run: |
          git config user.name 'artosperu-bot'
          git config user.email 'artosperu@gmail.com'
          git add src tests
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'feat: target scraping from Excel contract and expand official galleries'
            git push
          fi
