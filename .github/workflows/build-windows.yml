name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]" pyinstaller
      - name: Install bundled Chromium
        shell: cmd
        run: |
          mkdir vendor\ms-playwright
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\vendor\ms-playwright
          python -m playwright install chromium
      - name: Build
        shell: cmd
        run: pyinstaller --noconfirm --clean ProductIntelligence.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ProductIntelligence-Windows
          path: dist/ProductIntelligence/
