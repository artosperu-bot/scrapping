name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/windows
    paths:
      - 'src/**'
      - 'tests/**'
      - 'run_desktop.py'
      - 'run_updater.py'
      - 'pyproject.toml'
      - 'ProductIntelligence.spec'
      - 'vendor/**'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/release-windows.yml'
  push:
    branches:
      - main
      - feature/ocrspace-mistral-description
      - feature/auto-updater
    paths:
      - 'src/**'
      - 'tests/**'
      - 'run_desktop.py'
      - 'run_updater.py'
      - 'pyproject.toml'
      - 'ProductIntelligence.spec'
      - 'vendor/**'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/release-windows.yml'

permissions:
  contents: read

concurrency:
  group: product-intelligence-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Stage bundled Deno runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'vendor/deno' | Out-Null
          $deno = (Get-Command deno).Source
          if (-not $deno) { throw 'Deno runtime was not installed' }
          Copy-Item $deno 'vendor/deno/deno.exe' -Force
          & 'vendor/deno/deno.exe' --version

      - name: Install desktop profile
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"

      - name: Verify version sources match
        shell: pwsh
        run: |
          $appVersion = python -c "ns={}; exec(open('src/product_intelligence/version.py', encoding='utf-8').read(), ns); print(ns['APP_VERSION'])"
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($appVersion.Trim() -ne $projectVersion.Trim()) { throw "Version mismatch: app=$appVersion project=$projectVersion" }
          if ($appVersion.Trim() -ne '0.10.35') { throw "Unexpected release candidate version: $appVersion" }

      - name: Verify YouTube runtime wiring
        shell: pwsh
        run: |
          python -c "import yt_dlp_ejs; from product_intelligence.social_video_downloader import resolve_js_runtime; p=resolve_js_runtime(); assert p and p.lower().endswith('deno.exe'), p; print('YOUTUBE_EJS_RUNTIME=PASS', p)"

      - name: Run regression tests
        shell: cmd
        run: python -m pytest -q

      - name: Smoke modern desktop shell
        shell: cmd
        run: >-
          python -c "from product_intelligence.modern_desktop import App as ModernApp; from product_intelligence.provider_desktop import App; app=App(); app.update_idletasks(); assert app._active_workspace == 'dashboard'; required={'dashboard','products','sources','attributes','media','prices','run','audit','settings'}; assert required.issubset(app._workspace_tabs); assert 'settings' in app._nav_buttons; assert app.update_status.get().startswith('Versión instalada: v'); app.destroy(); print('PROVIDER_DESKTOP_SMOKE=PASS')"

      - name: Smoke final desktop shell
        shell: cmd
        run: >-
          python -c "from product_intelligence.final_live_ui_desktop import App; app=App(); app.update_idletasks(); assert 'settings' in app._workspace_tabs; assert 'pdf_review' in app._workspace_tabs; assert app.update_status.get().startswith('Versión instalada: v0.10.35'); assert hasattr(app, 'excel_progress_animation'); assert hasattr(app, 'media_progress_animation'); assert hasattr(app, 'price_progress_animation'); assert hasattr(app, 'social_video_btn'); assert hasattr(app, 'pdf_review_open_folder_button'); assert callable(getattr(app, '_pdf_review_open_folder', None)); app.destroy(); print('FINAL_UI_PDF_E2E_SMOKE=PASS')"

      - name: Install bundled Chromium
        shell: cmd
        run: |
          if not exist vendor\ms-playwright mkdir vendor\ms-playwright
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\vendor\ms-playwright
          python -m playwright install chromium

      - name: Build clean desktop bundle
        shell: cmd
        run: pyinstaller --noconfirm --clean ProductIntelligence.spec

      - name: Verify executables and progress resources
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ProductIntelligence/ProductIntelligence.exe')) { throw 'Missing ProductIntelligence.exe' }
          if (-not (Test-Path 'dist/ProductIntelligence/ProductIntelligenceUpdater.exe')) { throw 'Missing ProductIntelligenceUpdater.exe' }
          $processing = Get-ChildItem 'dist/ProductIntelligence' -Recurse -Filter 'processing.gif'
          $completed = Get-ChildItem 'dist/ProductIntelligence' -Recurse -Filter 'completed.gif'
          $ffmpegFiles = Get-ChildItem 'dist/ProductIntelligence' -Recurse -File | Where-Object { $_.Name -match '^ffmpeg.*\.exe$' }
          $denoFiles = Get-ChildItem 'dist/ProductIntelligence' -Recurse -Filter 'deno.exe'
          $ejsFiles = Get-ChildItem 'dist/ProductIntelligence' -Recurse -File | Where-Object { $_.FullName -match 'yt_dlp_ejs' }
          if (-not $processing) { throw 'processing.gif not bundled' }
          if (-not $completed) { throw 'completed.gif not bundled' }
          if (-not $ffmpegFiles) { throw 'Bundled FFmpeg binary missing' }
          if (-not $denoFiles) { throw 'Bundled Deno runtime missing' }
          if (-not $ejsFiles) { throw 'Bundled yt-dlp EJS scripts missing' }
          Write-Host "processing.gif=$($processing.FullName)"
          Write-Host "completed.gif=$($completed.FullName)"
          Write-Host "ffmpeg=$($ffmpegFiles.FullName -join ', ')"
          Write-Host "deno=$($denoFiles.FullName -join ', ')"
          Write-Host "ejs_files=$($ejsFiles.Count)"

      - name: Run packaged SMART E2E smoke
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'smart-packaged-evidence'
          if (Test-Path $evidence) { Remove-Item $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $exe = (Resolve-Path 'dist/ProductIntelligence/ProductIntelligence.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--smart-e2e-smoke', '--output-dir', $evidence) -WorkingDirectory $PWD -Wait -PassThru
          $exitCode = $process.ExitCode
          $report = Join-Path $evidence 'smart-packaged-smoke.json'
          if (-not (Test-Path $report)) { throw 'Packaged SMART smoke did not create smart-packaged-smoke.json' }
          $env:SMART_EVIDENCE_DIR = $evidence
          @'
          import json
          import os
          from pathlib import Path
          from openpyxl import load_workbook

          root = Path(os.environ['SMART_EVIDENCE_DIR'])
          report = json.loads((root / 'smart-packaged-smoke.json').read_text(encoding='utf-8'))
          assert report['entrypoint'] == 'SMART_PACKAGED_E2E'
          assert report['status'] == 'PASS', report
          assert len(report['scenarios']) >= 3

          exact = next(row for row in report['scenarios'] if row['scenario'] == 'EXACT_SKU_WEB_TO_EXCEL')
          assert exact['status'] == 'PASS', exact
          exact_xlsx = Path(exact['output_excel'])
          assert exact_xlsx.is_file(), exact_xlsx
          assert load_workbook(exact_xlsx, data_only=False)['Products']['B2'].value == 'Black'

          fallback = next(row for row in report['scenarios'] if row['scenario'] == 'PDF_ZERO_WEB_FALLBACK')
          assert fallback['status'] == 'PASS', fallback
          assert fallback['pdf_documents_found'] == 0
          assert fallback['broad_web_calls'] == 0
          assert fallback['targeted_web_calls'] == 1
          assert fallback['resolved_fields'] == ['driver_size']

          sibling = next(row for row in report['scenarios'] if row['scenario'] == 'SIBLING_WRITE_BARRIER')
          assert sibling['status'] == 'PASS', sibling
          sibling_xlsx = Path(sibling['output_excel'])
          assert sibling_xlsx.is_file(), sibling_xlsx
          assert load_workbook(sibling_xlsx, data_only=False)['Products']['B2'].value is None
          print('PACKAGED_SMART_E2E=PASS')
          '@ | python -
          if ($exitCode -ne 0) { throw "ProductIntelligence.exe SMART smoke failed with exit code $exitCode" }

      - name: Upload packaged SMART E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProductIntelligence-SMART-E2E-v0.10.35
          path: smart-packaged-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify standalone updater bootstrap
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP 'product-intelligence-updater-smoke'
          if (Test-Path $smokeDir) { Remove-Item $smokeDir -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          $smokeUpdater = Join-Path $smokeDir 'ProductIntelligenceUpdater.exe'
          Copy-Item 'dist/ProductIntelligence/ProductIntelligenceUpdater.exe' $smokeUpdater
          $process = Start-Process -FilePath $smokeUpdater -ArgumentList '--help' -WorkingDirectory $smokeDir -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone updater smoke failed with exit code $($process.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: ProductIntelligence-Windows-v0.10.35
          path: dist/ProductIntelligence/
          if-no-files-found: error
