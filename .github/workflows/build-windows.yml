name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ocrspace-mistral-description
    paths:
      - 'src/**'
      - 'tests/**'
      - 'run_desktop.py'
      - 'pyproject.toml'
      - 'ProductIntelligence.spec'
      - 'vendor/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: product-intelligence-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install desktop profile
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"

      - name: Run regression tests
        shell: cmd
        run: python -m pytest -q

      - name: Smoke modern desktop shell
        shell: cmd
        run: >-
          python -c "from product_intelligence.modern_desktop import App as ModernApp; from product_intelligence.provider_desktop import App; app=App(); app.update_idletasks(); assert app._active_workspace == 'dashboard'; required={'dashboard','products','sources','attributes','media','prices','run','audit','settings'}; assert required.issubset(app._workspace_tabs); assert 'settings' in app._nav_buttons; app.destroy(); print('PROVIDER_DESKTOP_SMOKE=PASS')"

      - name: Install bundled Chromium
        shell: cmd
        run: |
          if not exist vendor\ms-playwright mkdir vendor\ms-playwright
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\vendor\ms-playwright
          python -m playwright install chromium

      - name: Build clean desktop bundle
        shell: cmd
        run: pyinstaller --noconfirm --clean ProductIntelligence.spec

      - name: Verify executable exists
        shell: cmd
        run: |
          if not exist dist\ProductIntelligence\ProductIntelligence.exe exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: ProductIntelligence-Windows
          path: dist/ProductIntelligence/
          if-no-files-found: error
