name: CI

on:
  push:
    branches: [ main, ui-modernization-v1 ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: product-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install core + development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Check optional capability registry
        run: |
          python - <<'PY'
          from product_intelligence.capabilities import capability_status
          status = capability_status()
          assert status['vision'] == 'UNAVAILABLE'
          assert status['ocr'] == 'UNAVAILABLE'
          print(status)
          PY
