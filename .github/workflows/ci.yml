name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

concurrency:
  group: product-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install core + development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply compatibility fix only when missing
        run: |
          if grep -q 'signal_map = {query: signal for query, signal in _query_specs' src/product_intelligence/price_peru_coverage.py; then
            echo 'QUERY_TELEMETRY_COMPAT_ALREADY_APPLIED=1'
          else
            python scripts/qa_fix_query_telemetry_compat.py
            python -m pytest -q tests/test_universal_price_identity_recall.py tests/test_price_query_information_gain.py tests/test_price_query_plan_integration.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/product_intelligence/price_peru_coverage.py
            git diff --cached --exit-code && exit 0 || true
            git commit -m 'fix: preserve directed query seam with telemetry'
            git push origin HEAD:feat/universal-price-identity-recall
          fi
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Run deterministic SMART before-after benchmark
        run: |
          python -m product_intelligence.smart_orchestrator_benchmark --output smart-orchestrator-before-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("smart-orchestrator-before-after.json").read_text(encoding="utf-8"))
          before = report["summary"]["before"]
          after = report["summary"]["after"]
          print("BASELINE_REF=", report["baseline_ref"])
          print("BEFORE=", json.dumps(before, ensure_ascii=False, sort_keys=True))
          print("AFTER=", json.dumps(after, ensure_ascii=False, sort_keys=True))
          assert after["verified_fields"] >= before["verified_fields"]
          assert after["product_failures"] < before["product_failures"]
          assert after["broad_web_calls"] < before["broad_web_calls"]
          assert after["known_false_positive_writes"] == 0
          PY
      - name: Upload SMART before-after evidence
        uses: actions/upload-artifact@v4
        with:
          name: smart-orchestrator-before-after-${{ github.sha }}
          path: smart-orchestrator-before-after.json
          if-no-files-found: error
          retention-days: 14
      - name: Check optional capability registry
        run: |
          python - <<'PY'
          from product_intelligence.capabilities import capability_status
          status = capability_status()
          assert status['vision'] == 'UNAVAILABLE'
          assert status['ocr'] == 'UNAVAILABLE'
          print(status)
          PY
