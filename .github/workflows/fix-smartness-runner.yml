name: Repair smartness runner
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/fix-smartness-runner.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix runner syntax and push
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-template-smartness.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("''')),encoding='utf-8')", "'''),encoding='utf-8')")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add .github/workflows/apply-template-smartness.yml
          git commit -m "fix: smartness patch runner syntax"
          git push origin main
