name: Identity 20 Brand Benchmark

on:
  workflow_dispatch:

jobs:
  identity-20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      IDENTITY_BENCH_SHARD_COUNT: '4'
      IDENTITY_BENCH_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop profile
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
      - name: Install Chromium
        run: playwright install chromium
      - name: Run five unknown-brand cases
        run: python tests/integration_identity_20_brand_benchmark.py
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-20-brand-${{ matrix.shard }}
          path: identity-20-brand-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
