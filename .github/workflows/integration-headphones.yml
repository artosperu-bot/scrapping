name: Integration - Three Headphones

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/integration-headphones.yml'
      - 'src/product_intelligence/discovery.py'
      - 'src/product_intelligence/batch.py'
      - 'src/product_intelligence/pipeline.py'
      - 'src/product_intelligence/html_extract.py'
      - 'src/product_intelligence/source_extract.py'
      - 'src/product_intelligence/excel_mapper_v8.py'
      - 'src/product_intelligence/field_derivations.py'
      - 'src/product_intelligence/attribute_resolver.py'
      - 'src/product_intelligence/identity.py'

permissions:
  contents: read

concurrency:
  group: headphones-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium

      - name: Run unit and regression tests
        run: pytest -q

      - name: Validate raw source method on official JBL page
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from product_intelligence.models import ProductIdentity
          from product_intelligence.pipeline import ProductPipeline

          url = 'https://ca.jbl.com/en_CA/QUANTUM350WIRELESS-.html'
          expected = ProductIdentity(brand='JBL', mpn='JBLQ350WLBLKAM', model='Quantum 350 Wireless')
          record = ProductPipeline().process_official_url(expected, url, include_pdfs=False)
          raw = [e for e in record.evidence if e.source_type == 'official_source_html']
          print('official_url=', record.fetch.get('final_url'))
          print('identity=', record.identity.match_level, record.identity.identifiers_confirmed)
          print('raw_source_evidence=', len(raw))
          for e in raw[:30]:
              print('SOURCE', e.attribute, '=>', e.normalized_value, '|', e.selector)
          if record.identity.match_level != 'EXACT':
              raise SystemExit('Official JBL page did not validate exact identity')
          if not raw:
              raise SystemExit('Raw source layer extracted no evidence from official JBL page')
          PY

      - name: Run real scraping smoke test
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from product_intelligence.batch import run_batch

          part_numbers = [
              'JBLQ350WLBLKAM',
              'JBLENDURRUN3BTBAM',
              'JBLT530CBLKAM',
          ]
          out = Path('integration_output')
          summary = run_batch(
              'examples/ProductCreationTemplate_reference.xlsx',
              str(out),
              overwrite=True,
              log=print,
              manual_part_numbers=part_numbers,
          )
          print(summary)
          if summary['products_detected'] != 3:
              raise SystemExit(f"Expected 3 products, got {summary['products_detected']}")
          if summary['products_scraped'] != 3:
              raise SystemExit(f"Expected all 3 products to scrape, got {summary['products_scraped']}")
          if not Path(summary['output_excel']).exists():
              raise SystemExit('Completed Excel was not generated')
          PY

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headphones-integration-output
          path: |
            integration_output/
            src/product_intelligence/
          if-no-files-found: error
