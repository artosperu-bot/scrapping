name: Final headphone integration
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/integration-smartness-final.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Real 3-product run
        run: |
          python - <<'PY'
          from pathlib import Path
          from product_intelligence.batch import run_batch
          pns=['JBLQ350WLBLKAM','JBLENDURRUN3BTBAM','JBLT530CBLKAM']
          s=run_batch('examples/ProductCreationTemplate_reference.xlsx','integration_output',overwrite=True,log=print,manual_part_numbers=pns)
          print(s)
          assert s['products_detected']==3
          assert s['products_scraped']==3
          assert s['products_failed']==0
          PY
      - name: Upload current source and scraped records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-headphones-final
          path: |
            integration_output/
            src/product_intelligence/
          if-no-files-found: error
