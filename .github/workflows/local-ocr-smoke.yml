name: Local OCR Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/product_intelligence/local_ocr.py'
      - 'src/product_intelligence/pdf_extract.py'
      - 'src/product_intelligence/ocr_adapter.py'
      - 'src/product_intelligence/capabilities.py'
      - 'pyproject.toml'
      - 'ProductIntelligence.spec'
      - '.github/workflows/local-ocr-smoke.yml'
      - 'tests/test_local_ocr.py'

jobs:
  rapidocr-real:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install desktop OCR runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
      - name: OCR a real generated image
        shell: pwsh
        run: |
          @'
          import io
          from PIL import Image, ImageDraw, ImageFont
          from product_intelligence.local_ocr import rapidocr_text

          image = Image.new("RGB", (1200, 320), "white")
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype("arial.ttf", 80)
          draw.text((50, 90), "STECH OCR TEST 12345", fill="black", font=font)
          buf = io.BytesIO()
          image.save(buf, format="PNG")
          text = rapidocr_text(buf.getvalue())
          print("LOCAL_OCR_RESULT=", repr(text))
          normalized = text.upper().replace("-", " ")
          if "STECH" not in normalized or "OCR" not in normalized:
              raise SystemExit("LOCAL_OCR_SMOKE_FAILED")
          print("LOCAL_OCR_SMOKE=PASS")
          '@ | python -
