name: Media Integration Smoke

on:
  pull_request:
    paths:
      - 'src/product_intelligence/media_*.py'
      - 'src/product_intelligence/assets/**'
      - 'tests/test_media_*.py'
      - '.github/workflows/media-integration-smoke.yml'
  workflow_dispatch:

jobs:
  live-media-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run real multimedia smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from product_intelligence.models import ProductIdentity
          from product_intelligence.media_workflow import run_media_product

          cases = [
              (ProductIdentity(brand='JBL', model='Quantum 350 Wireless', mpn='JBLQ350WLBLKAM'), 'https://www.jbl.com.pe/JBLQ350WLBLKAM.html'),
              (ProductIdentity(brand='JBL', model='Endurance Run 3 Wireless', mpn='JBLENDURRUN3BTBAM'), 'https://www.jbl.com.pe/ENDURANCE-RUN-3-WIRELESS.html?dwvar_ENDURANCE-RUN-3-WIRELESS_color=Blue-GLOBAL-Current'),
              (ProductIdentity(brand='JBL', model='Tune 530C USB-C', mpn='JBLT530CBLKAM'), 'https://www.jbl.com.pe/TUNE530C-USB-C.html?dwvar_TUNE530C-USB-C_color=Black-AM-Current'),
          ]
          root = Path('media_smoke_output')
          total = 0
          small = []
          empty_products = []
          official_counts = {}
          official_page_not_validated = []

          for identity, official_url in cases:
              events = []
              rows = run_media_product(
                  identity,
                  root,
                  manual_urls=[official_url],
                  auto_search=True,
                  max_pages=8,
                  on_event=events.append,
              )
              accepted = [r for r in rows if r.get('downloaded') or r.get('metadata_only')]
              official = [r for r in accepted if r.get('official_page')]
              total += len(accepted)
              official_counts[identity.mpn] = len(official)

              manual_official_validated = any(
                  event.get('type') == 'page'
                  and event.get('source') == 'manual'
                  and event.get('status') == 'validated'
                  and event.get('official_page') is True
                  for event in events
              )
              if not manual_official_validated:
                  official_page_not_validated.append(identity.mpn)
              if not accepted:
                  empty_products.append(identity.mpn)

              for row in accepted:
                  if row.get('media_type') == 'image' and row.get('downloaded'):
                      w, h = row.get('width'), row.get('height')
                      if w is not None and h is not None and (w < 300 or h < 300 or w*h < 120000):
                          small.append((identity.mpn, row.get('url'), w, h))

              print('\n===', identity.mpn, 'accepted=', len(accepted), 'official=', len(official), '===')
              for event in events:
                  if event.get('type') in {'page','error'}:
                      print('EVENT', {k:event.get(k) for k in ('type','url','source','status','official_page','error') if event.get(k) is not None})
              reasons = Counter(e.get('reason') for e in events if e.get('type') == 'media_rejected')
              print('REJECT_REASONS=', dict(reasons))

          print('TOTAL_ACCEPTED_MEDIA=', total)
          print('OFFICIAL_COUNTS=', official_counts)
          print('SMALL_ACCEPTED=', small)
          print('EMPTY_PRODUCTS=', empty_products)
          print('OFFICIAL_PAGE_NOT_VALIDATED=', official_page_not_validated)

          if small:
              raise SystemExit(f'Small images were accepted: {small}')
          if official_page_not_validated:
              raise SystemExit(f'Official manual pages were not validated first: {official_page_not_validated}')
          if empty_products:
              raise SystemExit(f'Products with no validated media after official-first fallback: {empty_products}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-smoke-output
          path: media_smoke_output/
          if-no-files-found: warn
