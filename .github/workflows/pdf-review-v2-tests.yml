name: PDF Review V2 Tests

on:
  pull_request:
    branches:
      - release/windows
    paths:
      - 'src/product_intelligence/document_discovery.py'
      - 'src/product_intelligence/pdf_review.py'
      - 'src/product_intelligence/pdf_review_shell.py'
      - 'src/product_intelligence/pdf_review_batch.py'
      - 'src/product_intelligence/document_ingestion.py'
      - 'src/product_intelligence/pdf_extract.py'
      - 'src/product_intelligence/models.py'
      - 'tests/test_pdf_review*.py'
      - '.github/workflows/pdf-review-v2-tests.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused PDF review tests
        id: pytest
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_pdf_review.py
          tests/test_pdf_review_batch_contract.py
          tests/test_pdf_review_desktop_contract.py
          tests/test_pdf_review_discovery_v2.py
          tests/test_pdf_review_execution_v2.py
          -q --junitxml=pdf-review-v2-junit.xml
      - name: Annotate focused failures
        if: steps.pytest.outcome == 'failure'
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root = ET.parse('pdf-review-v2-junit.xml').getroot()
          count = 0
          for case in root.iter('testcase'):
              node = case.find('failure') or case.find('error')
              if node is None:
                  continue
              count += 1
              name = f"{case.get('classname','')}::{case.get('name','')}"
              message = (node.get('message') or (node.text or '')).replace('\n', ' ')[:1500]
              print(f"::error title=PDF Review V2 test failure::{name} — {message}")
          if count == 0:
              print('::error title=PDF Review V2 test failure::Focused pytest failed without a parsed junit failure')
          raise SystemExit(1)
      - name: Pass focused gate
        if: steps.pytest.outcome == 'success'
        run: echo 'PDF Review V2 focused tests PASS'
