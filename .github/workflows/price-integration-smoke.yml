name: Price Intelligence Smoke

on:
  pull_request:
    paths:
      - 'src/product_intelligence/price_*.py'
      - 'tests/test_price_*.py'
      - 'scripts/qa_p7_phase1_forensics.py'
      - 'scripts/qa_fix_p7_weight_reference_price.py'
      - '.github/workflows/price-integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-intelligence-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p7-weight-price-fix-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply deterministic P7 price semantics patch
        run: python scripts/qa_fix_p7_weight_reference_price.py
      - name: Verify focused price semantics
        run: python -m pytest -q tests/test_price_source_intelligence_and_access.py
      - name: Verify related price regression
        run: |
          python -m pytest -q tests/test_price_workflow.py tests/test_price_channel_coverage.py tests/test_price_marketplace_expansion.py tests/test_universal_price_identity_recall.py
      - name: Commit productive fix only after GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_discovery.py
          if git diff --cached --quiet; then
            echo 'P7_PRICE_FIX_ALREADY_COMMITTED=YES'
            exit 0
          fi
          git commit -m 'fix: reject SKU weight reference prices'
          git push origin HEAD:feat/universal-price-identity-recall

  p7-phase1-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Trace Ripley Promart PlazaVea first parser boundary
        run: python scripts/qa_p7_phase1_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-phase1-forensics-${{ github.sha }}
          path: p7_phase1_forensics.json
          if-no-files-found: warn
          retention-days: 14

  live-price-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run exact AFTER from MPN only
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from product_intelligence.models import ProductIdentity
          from product_intelligence.price_identity import is_peru_offer
          from product_intelligence.price_workflow import run_price_product

          identity = ProductIdentity(mpn="SA400S37/960G")
          events = []
          started = time.perf_counter()
          offers = run_price_product(identity, Path("price_after_output"), on_event=events.append, max_sources=72)
          runtime_seconds = round(time.perf_counter() - started, 3)
          foreign = [o.to_dict() for o in offers if not is_peru_offer(o)]
          strict = {'Falabella','Ripley','PlazaVea','Oechsle','MercadoLibre','Sodimac','JBL Perú'}
          ambiguous = [o.to_dict() for o in offers if o.source_method == 'html' and o.channel in strict]
          if foreign:
              raise SystemExit('Foreign offer leaked into Peru-only output: ' + json.dumps(foreign, ensure_ascii=False))
          if ambiguous:
              raise SystemExit('Ambiguous generic HTML marketplace price leaked: ' + json.dumps(ambiguous, ensure_ascii=False))

          report = {
              "input_identity": identity.model_dump(),
              "runtime_seconds": runtime_seconds,
              "events": events,
              "offers": [o.to_dict() for o in offers],
          }
          out = Path("price_after_output") / "after_sa400s37_960g.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")

          identity_events = [e for e in events if e.get("type") == "identity"]
          query_events = [e for e in events if e.get("type") == "query"]
          coverage_events = [e for e in events if e.get("type") == "coverage"]
          done_events = [e for e in events if e.get("type") == "done"]
          print("AFTER_INPUT=", json.dumps(identity.model_dump(), ensure_ascii=False, sort_keys=True))
          print("AFTER_IDENTITY=", json.dumps(identity_events[-1] if identity_events else {}, ensure_ascii=False, sort_keys=True))
          for event in query_events:
              print("AFTER_QUERY=", json.dumps(event, ensure_ascii=False, sort_keys=True))
          print("AFTER_COVERAGE=", json.dumps(coverage_events[-1] if coverage_events else {}, ensure_ascii=False, sort_keys=True))
          for offer in offers:
              print("AFTER_OFFER=", json.dumps(offer.to_dict(), ensure_ascii=False, sort_keys=True))
          print("AFTER_DONE=", json.dumps(done_events[-1] if done_events else {}, ensure_ascii=False, sort_keys=True))
          print("AFTER_RUNTIME_SECONDS=", runtime_seconds)
          print("AFTER_EVENTS=", len(events))
          print("AFTER_OFFERS=", len(offers))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-after-sa400s37-960g
          path: price_after_output/
          if-no-files-found: warn
          retention-days: 14
