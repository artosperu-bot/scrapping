name: Price Method Benchmark

on:
  pull_request:
    paths:
      - 'scripts/benchmark_price_methods_q350.py'
      - '.github/workflows/price-integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-method-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        method: [structured, directed, retail, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
      - name: Install Chromium
        if: matrix.method != 'structured'
        run: python -m playwright install chromium
      - name: Run one-product price method benchmark
        env:
          METHOD: ${{ matrix.method }}
          OCR_SPACE_ENABLED: 'false'
          MISTRAL_ENABLED: 'false'
        run: python scripts/benchmark_price_methods_q350.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-method-${{ matrix.method }}
          path: price_method_benchmark/${{ matrix.method }}/
          if-no-files-found: warn
