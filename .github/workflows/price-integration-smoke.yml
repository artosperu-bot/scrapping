name: Price Intelligence Smoke

on:
  pull_request:
    paths:
      - 'src/product_intelligence/price_*.py'
      - 'tests/test_price_*.py'
      - '.github/workflows/price-integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-price-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run real Peru multiseller discovery for JBL fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from product_intelligence.models import ProductIdentity
          from product_intelligence.price_identity import is_peru_offer
          from product_intelligence.price_workflow import run_price_product

          products = [
              ProductIdentity(brand='JBL', model='Quantum 350 Wireless', mpn='JBLQ350WLBLKAM'),
              ProductIdentity(brand='JBL', model='Endurance Run 3 Wireless', mpn='JBLENDURRUN3BTBAM'),
              ProductIdentity(brand='JBL', model='Tune 530C USB-C', mpn='JBLT530CBLKAM'),
          ]
          root = Path('price_smoke_output')
          total = 0
          q350 = []
          for identity in products:
              print('\n===', identity.mpn, '===')
              events = []
              offers = run_price_product(identity, root, on_event=events.append, max_sources=24)
              foreign = [o for o in offers if not is_peru_offer(o)]
              if foreign:
                  raise SystemExit('Foreign offer leaked into Peru-only output: ' + json.dumps([o.to_dict() for o in foreign], ensure_ascii=False))
              total += len(offers)
              if identity.mpn == 'JBLQ350WLBLKAM':
                  q350 = offers
              for offer in offers:
                  print(json.dumps(offer.to_dict(), ensure_ascii=False))
              print('offers=', len(offers), 'channels=', len({o.channel for o in offers}), 'sellers=', len({(o.channel, o.seller_display_name) for o in offers}), 'events=', len(events))

          print('TOTAL_VALIDATED_PERU_OFFERS=', total)
          print('Q350_VALIDATED_PERU_OFFERS=', len(q350))
          print('Q350_CHANNELS=', sorted({o.channel for o in q350}))
          print('Q350_SELLERS=', sorted({f'{o.channel}:{o.seller_display_name}' for o in q350}))
          if total < 1:
              raise SystemExit('No validated Peru price offer found for the 3 real JBL products')
          if len(q350) < 2:
              raise SystemExit('Q350 did not produce at least two independently validated Peru offers')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-smoke-output
          path: price_smoke_output/
          if-no-files-found: warn
