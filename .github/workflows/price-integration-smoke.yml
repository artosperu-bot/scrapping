name: Price Intelligence Smoke

on:
  pull_request:
    paths:
      - 'src/product_intelligence/price_*.py'
      - 'tests/test_price_*.py'
      - '.github/workflows/price-integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-price-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run real price discovery for JBL fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from product_intelligence.models import ProductIdentity
          from product_intelligence.price_workflow import run_price_product

          products = [
              ProductIdentity(brand='JBL', model='Quantum 350 Wireless', mpn='JBLQ350WLBLKAM'),
              ProductIdentity(brand='JBL', model='Endurance Run 3 Wireless', mpn='JBLENDURRUN3BTBAM'),
              ProductIdentity(brand='JBL', model='Tune 530C USB-C', mpn='JBLT530CBLKAM'),
          ]
          root = Path('price_smoke_output')
          total = 0
          for identity in products:
              print('\n===', identity.mpn, '===')
              events = []
              offers = run_price_product(identity, root, on_event=events.append, max_sources=6)
              total += len(offers)
              for offer in offers[:10]:
                  print(json.dumps(offer.to_dict(), ensure_ascii=False))
              print('offers=', len(offers), 'events=', len(events))
          print('TOTAL_VALIDATED_OFFERS=', total)
          if total < 1:
              raise SystemExit('No validated public price offer found for the 3 real JBL products')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-smoke-output
          path: price_smoke_output/
          if-no-files-found: warn
