name: Probe real products after upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-headphones-after-upgrade.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[browser,dev]'
          python -m playwright install --with-deps chromium
      - name: Run real batch
        run: |
          rm -rf integration_probe
          mkdir -p integration_probe/run
          python - <<'PY'
          import json
          from pathlib import Path
          from product_intelligence.batch import run_batch
          pns=['JBLQ350WLBLKAM','JBLENDURRUN3BTBAM','JBLT530CBLKAM']
          summary=run_batch(
              'examples/ProductCreationTemplate_reference.xlsx',
              'integration_probe/run',
              overwrite=True,
              manual_part_numbers=pns,
              log=print,
          )
          report={'summary':summary,'products':{}}
          for pn in pns:
              path=Path('integration_probe/run/json')/(pn+'.json')
              if not path.exists():
                  report['products'][pn]={'missing':True}
                  continue
              data=json.loads(path.read_text(encoding='utf-8'))
              report['products'][pn]={
                  'identity':data.get('identity'),
                  'fetch':data.get('fetch'),
                  'sources':data.get('sources'),
                  'evidence_count':len(data.get('evidence') or []),
                  'media_count':len(data.get('media') or []),
                  'image_count':len(data.get('images') or []),
                  'images':(data.get('images') or [])[:12],
                  'warnings':data.get('warnings'),
              }
          Path('integration_probe/probe_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit probe text outputs
        run: |
          git config user.name 'artosperu-bot'
          git config user.email 'artosperu@gmail.com'
          git add integration_probe/probe_report.json integration_probe/run/resumen.json integration_probe/run/trazabilidad.json integration_probe/run/template_contract.json integration_probe/run/json/*.json
          git commit -m 'test: capture post-upgrade real scraping probe' || exit 0
          git push
