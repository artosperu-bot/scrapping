name: QA Price BEFORE SA400S37 960G

on:
  push:
    branches:
      - qa/before-sa400s37-960g
    paths:
      - scripts/qa_price_before_sa400s37_960g.py
      - .github/workflows/qa-price-before-sa400s37-960g.yml
  pull_request:
    paths:
      - scripts/qa_price_before_sa400s37_960g.py
      - .github/workflows/qa-price-before-sa400s37-960g.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  before-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Compile QA harness
        run: python -m py_compile scripts/qa_price_before_sa400s37_960g.py
      - name: Run unchanged price engine with MPN-only Kingston input
        env:
          PRICE_BEFORE_OUTPUT: qa_price_before_output
        run: python scripts/qa_price_before_sa400s37_960g.py
      - name: Upload BEFORE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: before-sa400s37-960g
          path: qa_price_before_output/
          if-no-files-found: warn