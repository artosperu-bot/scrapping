name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - release/windows

permissions:
  contents: write

concurrency:
  group: product-intelligence-release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install desktop profile
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"

      - name: Verify version sources match
        shell: pwsh
        run: |
          $appVersion = python -c "ns={}; exec(open('src/product_intelligence/version.py', encoding='utf-8').read(), ns); print(ns['APP_VERSION'])"
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($appVersion.Trim() -ne $projectVersion.Trim()) { throw "Version mismatch: app=$appVersion project=$projectVersion" }
          "VERSION=$($appVersion.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run regression tests
        shell: cmd
        run: python -m pytest -q

      - name: Smoke provider desktop shell
        shell: cmd
        run: >-
          python -c "from product_intelligence.provider_desktop import App; app=App(); app.update_idletasks(); assert 'settings' in app._workspace_tabs; assert app.update_status.get().startswith('Versión instalada: v'); assert hasattr(app, 'excel_progress_animation'); assert hasattr(app, 'media_progress_animation'); assert hasattr(app, 'price_progress_animation'); app.destroy(); print('PROGRESS_UI_SMOKE=PASS')"

      - name: Install bundled Chromium
        shell: cmd
        run: |
          if not exist vendor\ms-playwright mkdir vendor\ms-playwright
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\vendor\ms-playwright
          python -m playwright install chromium

      - name: Build clean desktop bundle
        shell: cmd
        run: pyinstaller --noconfirm --clean ProductIntelligence.spec

      - name: Verify executables and progress resources
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ProductIntelligence/ProductIntelligence.exe')) { throw 'Missing ProductIntelligence.exe' }
          if (-not (Test-Path 'dist/ProductIntelligence/ProductIntelligenceUpdater.exe')) { throw 'Missing ProductIntelligenceUpdater.exe' }
          $processing = Get-ChildItem 'dist/ProductIntelligence' -Recurse -Filter 'processing.gif'
          $completed = Get-ChildItem 'dist/ProductIntelligence' -Recurse -Filter 'completed.gif'
          if (-not $processing) { throw 'processing.gif not bundled' }
          if (-not $completed) { throw 'completed.gif not bundled' }
          Write-Host "processing.gif=$($processing.FullName)"
          Write-Host "completed.gif=$($completed.FullName)"

      - name: Verify standalone updater bootstrap
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP 'product-intelligence-updater-smoke'
          if (Test-Path $smokeDir) { Remove-Item $smokeDir -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          $smokeUpdater = Join-Path $smokeDir 'ProductIntelligenceUpdater.exe'
          Copy-Item 'dist/ProductIntelligence/ProductIntelligenceUpdater.exe' $smokeUpdater
          $process = Start-Process -FilePath $smokeUpdater -ArgumentList '--help' -WorkingDirectory $smokeDir -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Standalone updater smoke failed with exit code $($process.ExitCode)" }

      - name: Create release ZIP and SHA256
        shell: pwsh
        run: |
          if (Test-Path ProductIntelligence-Windows.zip) { Remove-Item ProductIntelligence-Windows.zip -Force }
          Compress-Archive -Path dist/ProductIntelligence -DestinationPath ProductIntelligence-Windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash ProductIntelligence-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ProductIntelligence-Windows.zip" | Set-Content -Path ProductIntelligence-Windows.sha256 -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag ProductIntelligence-Windows.zip ProductIntelligence-Windows.sha256 --clobber
          } else {
            gh release create $tag ProductIntelligence-Windows.zip ProductIntelligence-Windows.sha256 --target $env:GITHUB_SHA --title "ProductIntelligence $tag" --generate-notes
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ProductIntelligence-Windows-v${{ env.VERSION }}
          path: |
            ProductIntelligence-Windows.zip
            ProductIntelligence-Windows.sha256
          if-no-files-found: error
