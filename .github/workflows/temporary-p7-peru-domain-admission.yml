name: Temporary P7 Peru Domain Admission

on:
  pull_request:
    paths:
      - scripts/qa_fix_p7_peru_domain_admission.py
      - tests/test_price_p7_peru_domain_admission.py
      - src/product_intelligence/price_peru_coverage.py
      - '.github/workflows/temporary-p7-peru-domain-admission.yml'

permissions:
  contents: write

jobs:
  peru-domain-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python scripts/qa_fix_p7_peru_domain_admission.py
      - run: python -m pytest -q tests/test_price_p7_peru_domain_admission.py
      - run: python -m pytest -q tests/test_price_query_plan_integration.py tests/test_price_query_information_gain.py tests/test_price_domain_alias_hint_budget.py tests/test_price_p7_brand_mpn_discovery.py
      - name: Commit only after GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_peru_coverage.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: admit Peru-named dotcom product URLs'
          git push origin HEAD:feat/universal-price-identity-recall
