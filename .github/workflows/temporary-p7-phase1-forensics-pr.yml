name: Temporary P7 Phase1 Forensics PR

on:
  pull_request:
    paths:
      - scripts/qa_p7_phase1_forensics.py
      - scripts/qa_p7_promart_vtex_probe.py
      - scripts/qa_p7_phase3_forensics.py
      - tests/test_price_marketplace_expansion.py
      - tests/test_price_p7_mercadolibre_semantics.py
      - '.github/workflows/temporary-p7-phase1-forensics-pr.yml'

permissions:
  contents: read

jobs:
  ml-terminal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_price_p7_mercadolibre_semantics.py

  specialist-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
      - run: python scripts/qa_p7_phase3_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-phase3-forensics-${{ github.sha }}
          path: p7_phase3_forensics.json
          if-no-files-found: warn
          retention-days: 14

  vtex-identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_price_marketplace_expansion.py

  promart-vtex:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python scripts/qa_p7_promart_vtex_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-promart-vtex-${{ github.sha }}
          path: p7_promart_vtex_probe.json
          if-no-files-found: warn
          retention-days: 14

  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
          python -m playwright install chromium
      - run: python scripts/qa_p7_phase1_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-phase1-forensics-${{ github.sha }}
          path: p7_phase1_forensics.json
          if-no-files-found: warn
          retention-days: 14
