# P7 post Peru-offer-semantics evidence checkpoint
name: Temporary P7 Phase1 Forensics PR

on:
  pull_request:
    paths:
      - scripts/qa_p7_phase1_forensics.py
      - scripts/qa_p7_promart_vtex_probe.py
      - scripts/qa_p7_phase3_forensics.py
      - scripts/qa_fix_p7_mercadolibre_semantics.py
      - scripts/qa_fix_p7_brand_mpn_discovery.py
      - scripts/qa_p7_micro_gate.py
      - scripts/qa_p7_residual_forensics.py
      - scripts/qa_p7_compumarket_dedupe_probe.py
      - tests/test_price_marketplace_expansion.py
      - tests/test_price_p7_mercadolibre_semantics.py
      - tests/test_price_p7_brand_mpn_discovery.py
      - '.github/workflows/temporary-p7-phase1-forensics-pr.yml'

permissions:
  contents: write

jobs:
  brand-mpn-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/universal-price-identity-recall, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python scripts/qa_fix_p7_brand_mpn_discovery.py
      - run: python -m pytest -q tests/test_price_p7_brand_mpn_discovery.py
      - run: python -m pytest -q tests/test_price_query_plan_integration.py tests/test_price_query_information_gain.py tests/test_price_domain_alias_hint_budget.py
      - name: Commit only after GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_peru_coverage.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: add verified brand MPN Peru scope discovery'
          git push origin HEAD:feat/universal-price-identity-recall

  p7-micro-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/universal-price-identity-recall, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
      - run: python scripts/qa_p7_micro_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p7-micro-gate-${{ github.sha }}', path: p7_micro_gate.json, retention-days: 14}

  p7-residual-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/universal-price-identity-recall, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
      - run: python scripts/qa_p7_residual_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p7-residual-forensics-${{ github.sha }}', path: p7_residual_forensics.json, retention-days: 14}

  promart-live-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/universal-price-identity-recall, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python scripts/qa_p7_promart_vtex_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p7-promart-live-${{ github.sha }}', path: p7_promart_vtex_probe.json, retention-days: 14}

  compumarket-dedupe-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/universal-price-identity-recall, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
      - run: python scripts/qa_p7_compumarket_dedupe_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p7-compumarket-dedupe-${{ github.sha }}', path: p7_compumarket_dedupe_probe.json, retention-days: 14}

  ml-terminal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/universal-price-identity-recall, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python scripts/qa_fix_p7_mercadolibre_semantics.py
      - run: python -m pytest -q tests/test_price_p7_mercadolibre_semantics.py tests/test_mercadolibre_oauth.py tests/test_price_marketplace_expansion.py
      - name: Commit only after GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_workflow.py src/product_intelligence/price_trace.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: classify Mercado Libre terminal states'
          git push origin HEAD:feat/universal-price-identity-recall

  specialist-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[desktop,dev]'
      - run: python scripts/qa_p7_phase3_forensics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'p7-phase3-forensics-${{ github.sha }}', path: p7_phase3_forensics.json, retention-days: 14}

  vtex-identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_price_marketplace_expansion.py
