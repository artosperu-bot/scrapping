name: Temporary P7 Publication Dedupe

on:
  pull_request:
    paths:
      - tests/test_price_p7_publication_dedupe.py
      - scripts/qa_fix_p7_publication_dedupe.py
      - src/product_intelligence/price_identity.py
      - '.github/workflows/temporary-p7-publication-dedupe.yml'

permissions:
  contents: write

jobs:
  publication-dedupe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_price_p7_publication_dedupe.py
