name: Temporary P7 Weight Price Fix

on:
  push:
    branches:
      - feat/universal-price-identity-recall
    paths:
      - scripts/qa_fix_p7_weight_reference_price.py
      - .github/workflows/temporary-p7-weight-price-fix.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply deterministic P7 price semantics patch
        run: python scripts/qa_fix_p7_weight_reference_price.py
      - name: Verify focused price semantics
        run: python -m pytest -q tests/test_price_source_intelligence_and_access.py
      - name: Verify related price regression
        run: |
          python -m pytest -q tests/test_price_workflow.py tests/test_price_channel_coverage.py tests/test_price_marketplace_expansion.py tests/test_universal_price_identity_recall.py
      - name: Commit verified productive fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_discovery.py
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'fix: reject SKU weight reference prices'
          git push origin HEAD:feat/universal-price-identity-recall
