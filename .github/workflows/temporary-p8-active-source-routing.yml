name: Temporary P8 Active Source Routing

on:
  pull_request:
    paths:
      - tests/test_price_p8_active_source_routing.py
      - src/product_intelligence/price_source_capabilities.py
      - src/product_intelligence/price_workflow.py
      - scripts/qa_fix_p8_active_source_routing.py
      - '.github/workflows/temporary-p8-active-source-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p8-active-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Focused P8 contract
        run: python -m pytest -q tests/test_price_p8_active_source_routing.py
