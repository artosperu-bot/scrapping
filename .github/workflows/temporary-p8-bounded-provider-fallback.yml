name: Temporary P8 Bounded Provider Fallback

on:
  pull_request:
    paths:
      - tests/test_price_p8_bounded_provider_fallback.py
      - tests/test_price_p8_active_source_routing.py
      - tests/test_price_p8_routing_concurrency.py
      - tests/test_price_p8_category_routing_universality.py
      - tests/test_price_source_memory.py
      - tests/test_price_source_memory_integration.py
      - src/product_intelligence/price_source_capabilities.py
      - src/product_intelligence/price_workflow.py
      - scripts/qa_fix_p8_bounded_provider_fallback.py
      - '.github/workflows/temporary-p8-bounded-provider-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p8-bounded-provider-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply minimal bounded provider fallback implementation
        run: python scripts/qa_fix_p8_bounded_provider_fallback.py
      - name: Focused P8 bounded provider fallback contract
        run: python -m pytest -q tests/test_price_p8_bounded_provider_fallback.py
      - name: Related P8 routing regression
        run: >-
          python -m pytest -q
          tests/test_price_p8_active_source_routing.py
          tests/test_price_p8_routing_concurrency.py
          tests/test_price_p8_category_routing_universality.py
          tests/test_price_source_memory.py
          tests/test_price_source_memory_integration.py
      - name: Commit only after GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_source_capabilities.py src/product_intelligence/price_workflow.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: bound learned provider fallback routing'
          git push origin HEAD:feat/universal-price-identity-recall
