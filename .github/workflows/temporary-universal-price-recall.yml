name: Temporary Universal Price Recall Core

on:
  push:
    branches:
      - feat/universal-price-identity-recall
    paths:
      - scripts/qa_apply_universal_price_recall_core.py
      - .github/workflows/temporary-universal-price-recall.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-identity-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply deterministic core patch
        run: python scripts/qa_apply_universal_price_recall_core.py
      - name: Verify focused RED contracts now GREEN
        run: |
          python -m pytest -q tests/test_price_trace_coverage.py tests/test_universal_price_identity_recall.py
      - name: Verify existing identity and price regressions
        run: |
          python -m pytest -q tests/test_price_workflow.py tests/test_identity_bootstrap.py tests/test_identity_general_hardening.py tests/test_identity_remaining_general_failures.py
      - name: Commit only verified productive files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/identity_bootstrap.py src/product_intelligence/price_discovery.py src/product_intelligence/discovery.py src/product_intelligence/price_peru_coverage.py
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'feat: harden identity and directed price discovery'
          git push origin HEAD:feat/universal-price-identity-recall
