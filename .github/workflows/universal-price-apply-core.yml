name: Apply Universal Price Core

on:
  push:
    branches:
      - feat/universal-price-intelligence
    paths:
      - 'scripts/qa_apply_universal_price_core.py'
      - '.github/workflows/universal-price-apply-core.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply guarded core changes
        run: python scripts/qa_apply_universal_price_core.py
      - name: Verify focused GREEN
        run: python -m pytest -q tests/test_price_universal_recall.py
      - name: Verify adjacent identity and price tests
        run: python -m pytest -q tests/test_identity_bootstrap.py tests/test_price_workflow.py
      - name: Commit verified productive changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/product_intelligence/price_channel_registry.py src/product_intelligence/identity_bootstrap.py src/product_intelligence/price_discovery.py src/product_intelligence/discovery.py src/product_intelligence/price_peru_coverage.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: harden universal price discovery core'
          git push origin HEAD:feat/universal-price-intelligence
