name: Apply Progressive Price Budget

on:
  push:
    branches:
      - feat/universal-price-intelligence
    paths:
      - 'tests/test_price_progressive_budget.py'
      - 'scripts/qa_apply_progressive_price_budget.py'
      - 'scripts/qa_fix_progressive_plan_order.py'
      - '.github/workflows/universal-price-apply-progressive-budget.yml'

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: RED then apply progressive budget then GREEN
        shell: bash
        run: |
          set +e
          mkdir -p qa
          : > /tmp/progressive-budget.log
          {
            echo "BASE=$(git rev-parse HEAD)"
            echo "=== RED ==="
            python -m pytest -q tests/test_price_progressive_budget.py
            red=$?
            echo "RED_EXIT=$red"
            if [ "$red" -eq 0 ]; then
              echo "RED_EXPECTATION_FAILED=progressive budget already satisfied unexpectedly"
              echo "PATCH_EXIT=NOT_RUN"
              echo "ORDER_FIX_EXIT=NOT_RUN"
              echo "FOCUSED_EXIT=NOT_RUN"
              echo "ADJACENT_EXIT=NOT_RUN"
              exit 91
            fi

            echo "=== PATCH ==="
            python scripts/qa_apply_progressive_price_budget.py
            patch_status=$?
            echo "PATCH_EXIT=$patch_status"
            if [ "$patch_status" -ne 0 ]; then
              echo "ORDER_FIX_EXIT=NOT_RUN"
              echo "FOCUSED_EXIT=NOT_RUN"
              echo "ADJACENT_EXIT=NOT_RUN"
              exit 92
            fi

            echo "=== PRESERVE MODEL FALLBACK ORDER ==="
            python scripts/qa_fix_progressive_plan_order.py
            order_status=$?
            echo "ORDER_FIX_EXIT=$order_status"
            if [ "$order_status" -ne 0 ]; then
              echo "FOCUSED_EXIT=NOT_RUN"
              echo "ADJACENT_EXIT=NOT_RUN"
              exit 94
            fi

            echo "=== FOCUSED GREEN ==="
            python -m pytest -q \
              tests/test_price_universal_recall.py \
              tests/test_price_trace_identity_integration.py \
              tests/test_price_query_capabilities.py \
              tests/test_price_marketplace_access_quality.py \
              tests/test_price_progressive_budget.py
            focused=$?
            echo "FOCUSED_EXIT=$focused"
            if [ "$focused" -ne 0 ]; then
              echo "ADJACENT_EXIT=NOT_RUN"
              exit 93
            fi

            echo "=== ADJACENT ==="
            python -m pytest -q tests/test_price_workflow.py tests/test_identity_bootstrap.py tests/test_price_channel_coverage.py
            adjacent=$?
            echo "ADJACENT_EXIT=$adjacent"
            exit $adjacent
          } 2>&1 | tee /tmp/progressive-budget.log
          overall=${PIPESTATUS[0]}
          set -e

          cp /tmp/progressive-budget.log qa/universal_price_progressive_budget.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/universal_price_progressive_budget.txt
          if [ "$overall" -eq 0 ]; then
            git add src/product_intelligence/price_peru_coverage.py
          fi
          git diff --cached --quiet || git commit -m 'perf: bound progressive price discovery queries'
          git push origin HEAD:feat/universal-price-intelligence
          exit $overall
# retrigger: 2
