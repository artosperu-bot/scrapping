name: Apply Query Capabilities

on:
  push:
    branches:
      - feat/universal-price-intelligence
    paths:
      - 'scripts/qa_apply_query_capabilities.py'
      - '.github/workflows/universal-price-apply-query-capabilities.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply P2 P2.5 P3 and verify
        shell: bash
        run: |
          set +e
          {
            echo "BASE=$(git rev-parse HEAD)"
            python scripts/qa_apply_query_capabilities.py
            patch_status=$?
            echo "PATCH_EXIT=$patch_status"
            if [ "$patch_status" -eq 0 ]; then
              python -m pytest -q tests/test_price_universal_recall.py tests/test_price_trace_identity_integration.py tests/test_price_query_capabilities.py
              focused_status=$?
              echo "FOCUSED_EXIT=$focused_status"
            else
              focused_status=99
              echo "FOCUSED_EXIT=NOT_RUN"
            fi
            if [ "$patch_status" -eq 0 ] && [ "$focused_status" -eq 0 ]; then
              python -m pytest -q tests/test_identity_bootstrap.py tests/test_price_workflow.py
              adjacent_status=$?
              echo "ADJACENT_EXIT=$adjacent_status"
            else
              adjacent_status=99
              echo "ADJACENT_EXIT=NOT_RUN"
            fi
          } 2>&1 | tee /tmp/query-capabilities.log
          overall=0
          grep -q '^PATCH_EXIT=0$' /tmp/query-capabilities.log || overall=1
          grep -q '^FOCUSED_EXIT=0$' /tmp/query-capabilities.log || overall=1
          grep -q '^ADJACENT_EXIT=0$' /tmp/query-capabilities.log || overall=1
          set -e

          mkdir -p qa
          cp /tmp/query-capabilities.log qa/universal_price_query_capabilities.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/universal_price_query_capabilities.txt
          if [ "$overall" -eq 0 ]; then
            git add src/product_intelligence/discovery.py src/product_intelligence/price_peru_coverage.py src/product_intelligence/price_source_capabilities.py src/product_intelligence/price_workflow.py
          fi
          git diff --cached --quiet || git commit -m 'feat: add query intelligence and source capability memory'
          git push origin HEAD:feat/universal-price-intelligence
          exit $overall
