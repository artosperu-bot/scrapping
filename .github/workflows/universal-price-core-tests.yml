name: Universal Price Core Tests

on:
  push:
    branches:
      - feat/universal-price-intelligence
    paths:
      - 'src/product_intelligence/price_*.py'
      - 'src/product_intelligence/discovery.py'
      - 'src/product_intelligence/identity_bootstrap.py'
      - 'src/product_intelligence/identifiers.py'
      - 'src/product_intelligence/mercadolibre_oauth.py'
      - 'tests/test_price_universal_recall.py'
      - 'tests/test_price_trace_identity_integration.py'
      - '.github/workflows/universal-price-core-tests.yml'
  pull_request:
    paths:
      - 'src/product_intelligence/price_*.py'
      - 'src/product_intelligence/discovery.py'
      - 'src/product_intelligence/identity_bootstrap.py'
      - 'src/product_intelligence/identifiers.py'
      - 'src/product_intelligence/mercadolibre_oauth.py'
      - 'tests/test_price_universal_recall.py'
      - 'tests/test_price_trace_identity_integration.py'

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run focused tests and persist evidence
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_price_universal_recall.py tests/test_price_trace_identity_integration.py 2>&1 | tee /tmp/universal-price-test.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p qa
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "pytest_exit_code=$status"
            cat /tmp/universal-price-test.log
          } > qa/universal_price_test_result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/universal_price_test_result.txt
          git diff --cached --quiet || git commit -m 'test: persist universal price focused result'
          git push origin HEAD:feat/universal-price-intelligence
          exit $status
