name: Universal Price Marketplace RED

on:
  push:
    branches:
      - feat/universal-price-intelligence
    paths:
      - '.github/workflows/universal-price-marketplace-red.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-price-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Capture behavioral RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_price_marketplace_access_quality.py 2>&1 | tee /tmp/marketplace-red.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p qa
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "pytest_exit_code=$status"
            cat /tmp/marketplace-red.log
          } > qa/universal_price_marketplace_red.txt
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add qa/universal_price_marketplace_red.txt
          git diff --cached --quiet || git commit -m 'test: persist P4 P5 P5.5 RED'
          git push origin HEAD:feat/universal-price-intelligence
          exit $status
