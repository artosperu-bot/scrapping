[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-intelligence"
version = "0.10.3"
description = "Motor de inteligencia de producto con identidad fuerte, evidencia trazable, media intelligence y completado seguro de Excel."
requires-python = ">=3.10"
authors = [{ name = "S&T Store" }]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "PyMuPDF>=1.24",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "extruct>=0.18",
]

[project.optional-dependencies]
browser = ["playwright>=1.55"]
vision = ["numpy>=1.26", "opencv-python-headless>=4.10"]
ocr = ["numpy>=1.26", "opencv-python-headless>=4.10", "paddleocr>=2.8", "paddlepaddle>=2.6"]
documents = ["docling>=2.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
cli = ["typer>=0.12"]
desktop = ["playwright>=1.55", "pyinstaller>=6.10"]
dev = ["pytest>=8.0"]
full = [
  "playwright>=1.55",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "paddleocr>=2.8",
  "paddlepaddle>=2.6",
  "docling>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "typer>=0.12",
]

[project.scripts]
product-intel = "product_intelligence.cli:app"
product-intel-desktop = "product_intelligence.price_desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
